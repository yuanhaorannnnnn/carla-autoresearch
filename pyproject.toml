[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-agent"
version = "0.1.0.dev0"
description = "Atomic CARLA operations and reproducible bounded experiments for coding agents"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
legacy = ["PyYAML>=6"]
test = ["pytest>=7", "PyYAML>=6"]

[project.scripts]
carla-agent = "carla_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carla_agent = ["skill_catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
